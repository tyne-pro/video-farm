# Builds the farm app (macOS first; Windows and Linux are prepared below) and publishes the installers as a GitHub release
# of this repository (author: github-actions). A release is made once per app version.
name: Build the app

on:
  push:
    branches: [main]
    paths: ['app/**', 'lib/**', 'remotion/**', 'scripts/**', 'studio/**', 'server.mjs', 'package.json', 'package-lock.json', 'ui/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          # Windows and Linux come next; uncomment to build them too
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   args: --target x86_64-pc-windows-msvc --bundles nsis
          # - os: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xz-utils
      - name: Programs and generator for the app
        working-directory: app
        env:
          FARM_GENERATOR_DIR: '..'
        run: |
          npm ci --no-audit --no-fund
          node scripts/prepare-resources.mjs ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'Ферма роликів __VERSION__'
          releaseBody: 'Installers of the tyne.pro video farm. Install guide and the VirusTotal check: https://cp.tyne.pro/tools/farm'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
