<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TyneFarm</title>
<style>
  /* The tyne.pro cabinet tokens */
  :root {
    --bg-base: #201f1e; --bg-surface: #2b2822; --bg-border: #3d3a33;
    --text-primary: #f3eee6; --text-secondary: #c9c2b8; --text-muted: #b8b1a7;
    --accent: rgb(240 163 58); --accent-rgb: 240 163 58; --on-accent: #1a1206;
    --green: rgb(62 230 168); --red: rgb(255 122 107);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg-base: #f6f2ea; --bg-surface: #fffdf9; --bg-border: #e2dacb; --text-primary: #1b1712; --text-secondary: #514c45; --text-muted: #6b645a; --accent: rgb(196 112 10); --accent-rgb: 196 112 10; --on-accent: #fff; --green: rgb(10 140 96); --red: rgb(200 60 45); color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-base); color: var(--text-primary); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: 18px; display: grid; gap: 12px; min-height: 100vh; align-content: start; }
  header { display: flex; align-items: center; gap: 12px; }
  .logo { height: 44px; width: 44px; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--bg-border); background: var(--bg-surface); color: var(--accent); flex: none; }
  .brand { min-width: 0; flex: 1; }
  h1 { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 700; }
  .sub { margin: 1px 0 0; font-size: 13px; color: var(--text-muted); }
  .badge { flex: none; border-radius: 999px; border: 1px solid rgb(var(--accent-rgb) / .5); background: rgb(var(--accent-rgb) / .1); color: var(--accent); padding: 4px 11px; font-size: 12.5px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge[hidden] { display: none; }
  .card { border-radius: 18px; border: 1px solid var(--bg-border); background: var(--bg-surface); padding: 6px 14px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 52px; }
  .row + .row { border-top: 1px solid var(--bg-border); }
  .row .text { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 0 4px rgb(62 230 168 / .15); }
  .dot.amber { background: var(--accent); box-shadow: 0 0 0 4px rgb(var(--accent-rgb) / .15); }
  .dot.wait { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .dot.bad { background: var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.wait { animation: none; } }
  .small { flex: none; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--bg-border); background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .small:hover { color: var(--text-primary); border-color: rgb(var(--accent-rgb) / .5); }
  .hint { margin: 0; padding: 0 0 12px; font-size: 13px; color: var(--text-secondary); }
  .hint:empty { display: none; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: filter .15s, border-color .15s, color .15s; }
  .btn.main { background: var(--accent); color: var(--on-accent); }
  .btn.main:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--bg-border); font-weight: 500; }
  .btn.ghost:hover { border-color: rgb(var(--accent-rgb) / .5); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .log-title { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  pre { margin: 0; min-height: 120px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-muted); border: 1px solid var(--bg-border); border-radius: 12px; padding: 10px 12px; background: var(--bg-surface); }
  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--text-muted); }
  footer button { background: none; border: 0; padding: 6px 0; min-height: 32px; color: var(--text-secondary); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
    </span>
    <div class="brand">
      <h1 data-t="title">Ферма роликів</h1>
      <p class="sub">tyne.pro</p>
    </div>
    <span class="badge" id="badge" hidden></span>
  </header>

  <section class="card" aria-live="polite">
    <div class="row">
      <span class="dot wait" id="genDot"></span><span class="text" id="genText">…</span>
      <button class="small" id="restart" data-t="restart">Перезапустити</button>
    </div>
    <p class="hint" id="genHint"></p>
    <div class="row">
      <span class="dot" id="cabDot"></span><span class="text" id="cabText"></span>
      <button class="small" id="cabBtn"></button>
    </div>
  </section>

  <button class="btn main" id="open" data-t="open">Відкрити ферму в кабінеті</button>
  <div class="pair">
    <button class="btn ghost" id="clips" data-t="clips">Мої ролики й редактор</button>
    <button class="btn ghost" id="done" data-t="done">Папка «Готово»</button>
  </div>

  <p class="log-title" data-t="log">Журнал</p>
  <pre id="log"></pre>

  <footer>
    <span id="ver"></span>
    <button id="code" data-t="code">Код на GitHub</button>
    <button id="folder" data-t="folder">Папка ферми</button>
  </footer>

<script>
  const T = {
    uk: { clips: 'Мої ролики й редактор', title: 'Ферма роликів', restart: 'Перезапустити', open: 'Відкрити ферму в кабінеті', done: 'Папка «Готово»', code: 'Код на GitHub', log: 'Журнал', folder: 'Папка ферми',
      running: 'Генератор працює', preparing: 'Перший запуск: готуємо програму', starting: 'Запускаємо генератор…', stopped: 'Генератор зупинено', error: 'Генератор не запустився', idle: 'Запускаємо…',
      hPreparing: 'Один раз, ~1.7 ГБ, 5–15 хвилин. Вікно можна згорнути.', hError: 'Натисніть «Перезапустити».', hStopped: 'Натисніть «Перезапустити».',
      connected: 'Кабінет підключено', notConnected: 'Кабінет не підключено', connect: 'Підключити кабінет', disconnect: 'Відключити',
      demo: 'Демо', premium: 'Premium', pro: 'Pro', of: 'з', version: 'Версія' },
    ru: { clips: 'Мои ролики и редактор', title: 'Ферма роликов', restart: 'Перезапустить', open: 'Открыть ферму в кабинете', done: 'Папка «Готово»', code: 'Код на GitHub', log: 'Журнал', folder: 'Папка фермы',
      running: 'Генератор работает', preparing: 'Первый запуск: готовим программу', starting: 'Запускаем генератор…', stopped: 'Генератор остановлен', error: 'Генератор не запустился', idle: 'Запускаем…',
      hPreparing: 'Один раз, ~1.7 ГБ, 5–15 минут. Окно можно свернуть.', hError: 'Нажмите «Перезапустить».', hStopped: 'Нажмите «Перезапустить».',
      connected: 'Кабинет подключён', notConnected: 'Кабинет не подключён', connect: 'Подключить кабинет', disconnect: 'Отключить',
      demo: 'Демо', premium: 'Premium', pro: 'Pro', of: 'из', version: 'Версия' },
    en: { clips: 'My clips and editor', title: 'Video farm', restart: 'Restart', open: 'Open the farm in the cabinet', done: 'Finished clips', code: 'Code on GitHub', log: 'Log', folder: 'Farm folder',
      running: 'Generator is running', preparing: 'First run: preparing the app', starting: 'Starting the generator…', stopped: 'Generator stopped', error: 'Generator did not start', idle: 'Starting…',
      hPreparing: 'Once, ~1.7 GB, 5–15 minutes. You can minimise the window.', hError: 'Press Restart.', hStopped: 'Press Restart.',
      connected: 'Cabinet connected', notConnected: 'Cabinet not connected', connect: 'Connect the cabinet', disconnect: 'Disconnect',
      demo: 'Demo', premium: 'Premium', pro: 'Pro', of: 'of', version: 'Version' },
  }
  const nav = (navigator.language || 'uk').slice(0, 2)
  const lang = nav === 'ru' ? 'ru' : nav === 'en' ? 'en' : 'uk'
  const t = T[lang]
  document.documentElement.lang = lang
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t] })

  const { invoke } = window.__TAURI__.core
  const { listen } = window.__TAURI__.event
  const $ = (id) => document.getElementById(id)
  const logEl = $('log')
  const DOT = { running: 'ok', preparing: 'wait', starting: 'wait', idle: 'wait', stopped: 'bad', error: 'bad' }
  const HINT = { preparing: 'hPreparing', stopped: 'hStopped', error: 'hError' }
  let connected = false

  function render(s) {
    const phase = s.phase || 'idle'
    $('genDot').className = 'dot ' + (DOT[phase] || 'wait')
    $('genText').textContent = t[phase] || t.idle
    $('genHint').textContent = t[HINT[phase]] || ''
    connected = !!s.connected
    const me = s.me
    $('cabDot').className = 'dot ' + (connected && me ? 'amber' : '')
    $('cabText').textContent = connected ? (me && me.login ? `${t.connected} · @${me.login}` : t.connected) : t.notConnected
    $('cabBtn').textContent = connected ? t.disconnect : t.connect
    const badge = $('badge')
    if (me && me.tier) {
      badge.hidden = false
      badge.textContent = `${t[me.tier] || me.tier} · ${me.left} ${t.of} ${me.limits.clips}`
    } else badge.hidden = true
    $('ver').textContent = `${t.version} ${s.version}`
    const atEnd = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8
    logEl.textContent = s.log.join('\n')
    if (atEnd) logEl.scrollTop = logEl.scrollHeight
  }
  const refresh = () => invoke('farm_status').then(render).catch(() => {})
  refresh()
  setInterval(refresh, 2500)
  listen('farm-phase', refresh)
  listen('farm-connected', refresh)
  listen('farm-log', refresh)

  $('open').onclick = () => invoke('open_link', { path: '/tools/farm' })
  $('cabBtn').onclick = () => (connected ? invoke('farm_disconnect').then(refresh) : invoke('open_link', { path: '/tools/farm#app' }))
  $('done').onclick = () => invoke('open_place', { place: 'done' })
  $('clips').onclick = () => invoke('open_link', { path: `http://127.0.0.1:4747/studio/?lang=${lang}&theme=${matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'}` })
  $('folder').onclick = () => invoke('open_place', { place: 'data' })
  $('restart').onclick = () => invoke('farm_restart').then(refresh)
  $('code').onclick = () => invoke('open_link', { path: 'https://github.com/tyne-pro/video-farm' })
</script>
</body>
</html>
