<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ферма роликів · tyne.pro</title>
<style>
  :root { --bg: #201f1e; --card: #2b2822; --line: #3d3a33; --ink: #f3eee6; --muted: #b8b1a7; --accent: rgb(240 163 58); --on: #1a1206; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f2ea; --card: #fffdf9; --line: #e2dacb; --ink: #1b1712; --muted: #6b645a; --accent: rgb(196 112 10); --on: #fff; color-scheme: light; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 440px; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 18px; padding: 24px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 18px; color: var(--muted); }
  a { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: var(--accent); color: var(--on); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Генератор працює</h1>
    <p>Монтаж ролика відбувається на сторінці ферми в кабінеті tyne.pro. Ця сторінка лише показує, що генератор на цьому комп’ютері запущено.</p>
    <a href="https://cp.tyne.pro/tools/farm">Відкрити ферму в кабінеті</a>
  </div>
</body>
</html>
