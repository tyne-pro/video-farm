<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ферма роликів tyne.pro</title>
<style>
  :root { --bg:#0e0d0b; --card:#191714; --line:#2c2924; --text:#f3efe6; --muted:#a39c8e; --butter:#fbe7a1; --err:#ff8a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input[type=text], select, textarea { width:100%; box-sizing:border-box; font-family:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#100f0d; color:var(--text); font-size:15px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:560px) { .row3 { grid-template-columns:1fr; } }
  @media (max-width:560px) { .row { grid-template-columns:1fr; } }
  .formats { display:flex; gap:8px; flex-wrap:wrap; }
  .formats button { flex:1; min-width:140px; padding:10px; border-radius:10px; border:1px solid var(--line); background:#100f0d; color:var(--text); cursor:pointer; }
  .formats button.on { border-color:var(--butter); color:var(--butter); }
  .drop { border:1.5px dashed var(--line); border-radius:12px; padding:16px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.has { border-style:solid; border-color:#4b6b3c; color:var(--text); }
  .go { width:100%; margin-top:16px; padding:14px; border:0; border-radius:12px; background:var(--butter); color:#1a160c; font-weight:700; font-size:16px; cursor:pointer; }
  .go:disabled { opacity:.5; cursor:default; }
  .bar { height:8px; background:#100f0d; border-radius:6px; overflow:hidden; margin:10px 0; }
  .bar i { display:block; height:100%; background:var(--butter); width:0; transition:width .3s; }
  pre { white-space:pre-wrap; font-size:12px; color:var(--muted); max-height:240px; overflow:auto; margin:0; }
  .err { color:var(--err); }
  a.dl { display:inline-block; margin-top:10px; padding:10px 16px; border-radius:10px; background:var(--butter); color:#1a160c; font-weight:700; text-decoration:none; }
  .check { display:flex; gap:8px; align-items:center; margin-top:12px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Ферма роликів tyne.pro</h1>
  <p class="sub">Ваше відео → готовий ролик: хук, субтитри, меми, зуми, звук.</p>

  <div class="card">
    <label>Название видео (из него делается хук)</label>
    <input id="title" type="text" placeholder="Например: 3 ошибки новичков в спортзале">

    <label>Формат</label>
    <div class="formats" id="formats">
      <button data-f="vertical" class="on">Вертикаль 9:16</button>
      <button data-f="horizontal">Горизонталь 16:9</button>
      <button data-f="talking">Разговорное (только голова)</button>
    </div>

    <div class="row">
      <div>
        <label>Голова (вертикальное видео, петличка)</label>
        <div class="drop" id="dropHead">Нажми или перетащи файл</div>
      </div>
      <div id="tabletBox">
        <label>Планшет (запись экрана)</label>
        <div class="drop" id="dropTablet">Нажми или перетащи файл</div>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Эмодзи для роллера</label>
        <input id="emoji" type="text" value="🍓" maxlength="4">
      </div>
      <div>
        <label>Качество распознавания</label>
        <select id="model">
          <option value="small">Быстро (small)</option>
          <option value="medium" selected>Хорошо (medium)</option>
          <option value="large-v3">Лучше всего, медленно (large-v3)</option>
        </select>
      </div>
    </div>
    <label>Описание и пожелания к ролику (необязательно)</label>
    <textarea id="notes" maxlength="1500" rows="3" style="width:100%;box-sizing:border-box" placeholder="О чём видео, что выделить, какие мемы"></textarea>
    <div class="row3">
      <div>
        <label>Частота мемов</label>
        <select id="density"><option value="rare">Реже (8–12 с)</option><option value="normal" selected>Обычно (5–8 с)</option><option value="often">Чаще (3–5 с)</option></select>
      </div>
      <div>
        <label>Какие мемы</label>
        <select id="mood"><option value="smart">По смыслу</option><option value="mix" selected>Микс</option><option value="absurd">Абсурд</option></select>
      </div>
      <div>
        <label>Музыка</label>
        <select id="music"><option value="0">Без музыки</option><option value="0.03" selected>Фон 3%</option><option value="0.05">Фон 5%</option></select>
      </div>
    </div>
    <div class="check"><input type="checkbox" id="zooms" checked><span>Зумы кадра каждые ~10 с</span></div>

    <button class="go" id="go">Смонтировать</button>
  </div>

  <div class="card" id="statusCard" hidden>
    <div id="stepText">Ожидание…</div>
    <div class="bar"><i id="bar"></i></div>
    <div id="result"></div>
    <pre id="log"></pre>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id)
const STEP = { probe:'Смотрю файлы', sync:'Синхронизирую по звуку', voice:'Вытягиваю голос', cuts:'Вырезаю паузы', proxy:'Готовлю видео', whisper:'Распознаю речь', memes:'Подбираю мемы', plan:'Claude пишет план монтажа', render:'Рендер' }
let format = 'vertical'
const files = { head: null, tablet: null }

try {
  const saved = JSON.parse(localStorage.getItem('farm') || '{}')
  if (saved.format) format = saved.format
  if (saved.emoji) $('emoji').value = saved.emoji
  if (saved.model) $('model').value = saved.model
} catch {}

function renderFormat() {
  for (const b of $('formats').children) b.classList.toggle('on', b.dataset.f === format)
  $('tabletBox').style.display = format === 'talking' ? 'none' : ''
}
$('formats').onclick = (e) => { if (e.target.dataset.f) { format = e.target.dataset.f; renderFormat() } }
renderFormat()

function bindDrop(el, slot) {
  const input = document.createElement('input')
  input.type = 'file'; input.accept = 'video/*'
  input.onchange = () => set(input.files[0])
  el.onclick = () => input.click()
  el.ondragover = (e) => e.preventDefault()
  el.ondrop = (e) => { e.preventDefault(); set(e.dataTransfer.files[0]) }
  function set(f) {
    if (!f) return
    files[slot] = f
    el.textContent = `${f.name} · ${(f.size / 1e6).toFixed(0)} МБ`
    el.classList.add('has')
  }
}
bindDrop($('dropHead'), 'head')
bindDrop($('dropTablet'), 'tablet')

function upload(jobId, slot, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest()
    xhr.open('PUT', `/api/jobs/${jobId}/upload/${slot}?name=${encodeURIComponent(file.name)}`)
    xhr.upload.onprogress = (e) => onProgress(e.loaded / e.total)
    xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error(xhr.responseText))
    xhr.onerror = () => reject(new Error('загрузка прервалась'))
    xhr.send(file)
  })
}

$('go').onclick = async () => {
  const title = $('title').value.trim()
  if (!title) return alert('Впиши название видео')
  if (!files.head) return alert('Добавь запись головы')
  if (format !== 'talking' && !files.tablet) return alert('Добавь запись планшета')
  try { localStorage.setItem('farm', JSON.stringify({ format, emoji: $('emoji').value, model: $('model').value })) } catch {}
  $('go').disabled = true
  $('statusCard').hidden = false
  $('result').innerHTML = ''
  try {
    const job = await (await fetch('/api/jobs', { method: 'POST' })).json()
    const slots = format === 'talking' ? ['head'] : ['head', 'tablet']
    for (const [i, slot] of slots.entries()) {
      await upload(job.id, slot, files[slot], (p) => {
        $('stepText').textContent = `Загружаю ${slot === 'head' ? 'голову' : 'планшет'}… ${Math.round(p * 100)}%`
        $('bar').style.width = `${((i + p) / slots.length) * 100}%`
      })
    }
    const res = await fetch(`/api/jobs/${job.id}/start`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, format, emoji: $('emoji').value, whisperModel: $('model').value, notes: $('notes').value, memeDensity: $('density').value, memeMood: $('mood').value, musicVolume: Number($('music').value), zooms: $('zooms').checked }),
    })
    if (!res.ok) throw new Error((await res.json()).error)
    poll(job.id)
  } catch (e) {
    $('stepText').innerHTML = `<span class="err">${e.message}</span>`
    $('go').disabled = false
  }
}

async function poll(id) {
  const j = await (await fetch(`/api/jobs/${id}`)).json()
  $('bar').style.width = `${Math.round(j.progress * 100)}%`
  $('log').textContent = j.log.join('\n')
  $('log').scrollTop = 1e9
  if (j.state === 'done') {
    $('stepText').textContent = 'Готово ✔'
    $('result').innerHTML = `<a class="dl" href="/api/jobs/${id}/result">Скачать MP4</a>`
    $('go').disabled = false
    return
  }
  if (j.state === 'error') {
    $('stepText').innerHTML = `<span class="err">Ошибка: ${j.error}</span>`
    $('go').disabled = false
    return
  }
  $('stepText').textContent = j.state === 'queued' ? 'В очереди…' : `${STEP[j.step] || 'Работаю'}… ${Math.round(j.progress * 100)}%`
  setTimeout(() => poll(id), 1500)
}
</script>
</body>
</html>
